name: Local-equivalent validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locked-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked application and isolated SDK
        run: |
          python -m pip install -r requirements-bootstrap.lock
          python -m pip install -r requirements-linux.lock
          python -m pip check
          python -m venv .venv-mcp-sdk
          .venv-mcp-sdk/bin/pip install -r requirements-bootstrap.lock
          .venv-mcp-sdk/bin/pip install -r requirements-mcp-client.lock
          python -m venv .venv-audit
          .venv-audit/bin/pip install -r requirements-audit.txt
      - name: Audit locked Python dependencies
        env:
          KONTEXT_AUDIT_PYTHON: ${{ github.workspace }}/.venv-audit/bin/python
        run: python -m scripts.audit_dependencies
      - name: Run native-equivalent evidence generation
        env:
          MCP_SDK_PYTHON: ${{ github.workspace }}/.venv-mcp-sdk/bin/python
        run: python -m scripts.generate_all_reports
      - name: Validate disposable hardened stack
        env:
          MCP_SDK_PYTHON: ${{ github.workspace }}/.venv-mcp-sdk/bin/python
        run: python -m scripts.validate_docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-evidence
          retention-days: 14
          path: |
            artifacts/reports/*.json
            artifacts/reports/*.xml
            artifacts/reports/pytest-output.txt
            artifacts/docker/**/report.json
            artifacts/docker/**/docker-tests.xml
            artifacts/docker/**/bounded-load.json
            artifacts/docker/**/postgres-retry-case.json
            artifacts/docker/**/container-tests.txt
            artifacts/docker/**/schema-upgrade.txt
